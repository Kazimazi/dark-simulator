<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Darksim</title>
		<link href="style.css" rel="stylesheet">
	</head>

	<body>
		<header>
			<h1>Kazimazi's Dark and Darker simulator</h1>
		</header>

		<section>
			<div id="parameters">
				<div id="enemy">
					<h2>Enemy</h2>

					<div id="enemy-parameters">
						<label for="enemy">Choose a preset</label>
						<select id="enemy-preset" class="row-2" autocomplete="off">
							<option value="demon">Demon</option>
							<option value="ranger">Ranger</option>
						</select>

						<label>Health</label>
						<input type="text" id="health" value="" autocomplete="off">

						<label>Max Health</label>
						<input type="text" id="max-health" value="" autocomplete="off">

						<label>Magical Damage Reduction</label>
						<div class="percent-container">
							<input type="text" id="magical-damage-reduction" value="" autocomplete="off">
						</div>

						<label for="antimagic">Antimagic</label>
						<div><input type="checkbox" id="antimagic" name="antimagic"></div>

						<label for="perseverance">Perseverance</label>
						<div><input type="checkbox" id="perseverance" name="perseverance"></div>

						<label for="debuff-duration-reduction">Debuff Duration Reduction</label>
						<div class="percent-container">
							<input type="text" id="debuff-duration-reduction" value="" autocomplete="off">
						</div>

						<label for="ona-man-band">One-Man Band</label>
						<div><input type="checkbox" id="one-man-band" name="one-man-band"></div>

						<label for="ona-man-band-magical-healing">Magical Healing</label>
						<input type="text" id="one-man-band-magical-healing" name="one-man-band-magical-healing" value="" autocomplete="off">
					</div>
				</div>

				<hr>

				<div id="attadcker">
					<h2>Attacker</h2>

					<div id="attacker-parameters">
						<label>Magical Base Damage</label>
						<input type="text" id="magical-base-damage" class="row-2" value="" autocomplete="off">

						<label>Magic Power Bonus</label>
						<div class="percent-container">
							<input type="text" id="magic-power-bonus" value="" autocomplete="off">
						</div>

						<label>Magic Penetration</label>
						<div class="percent-container">
							<input type="text" id="magic-penetration" value="" autocomplete="off">
						</div>

						<label>Additional Magic Damage</label>
						<input type="text" id="additional-magic-damage" value="" autocomplete="off">

						<label>True Magic Damage</label>
						<input type="text" id="true-magic-damage" value="" autocomplete="off">

						<label for="infernal-usery">Infernal Usery</label>
						<div><input type="checkbox" id="infernal-usery" name="infernal-usery"></div>
					</div>
				</div>
			</div>

			<br>

			<div>
				<select id="attack-type" autocomplete="off">
					<option value="curse-of-pain">Curse of Pain</option>
					<option value="curse-of-sacrifice">Curse of Sacrifice</option>
					<option value="dark-bolt">Dark Bolt (body)</option>
				</select>
				<button id="attack">Attack</button>
			</div>

			<br>

			<div id="status">
				<div id="health-bar-border">
					<div id="health-bar"></div>
					<div id="health-bar-text">
						<span id="current-health"></span>
						/ <span id="bar-max-health"></span>
					</div>
				</div>
				<div id="time-wrapper">Time: <span id="time">Paused</span></div>
			</div>

			<script type="module" src="./app.js"></script>
		</section>

		<footer>
			Made for Early Access Hotfix #130
		</footer>
	</body>
</html>
