<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Darksim</title>
		<link href="style.css" rel="stylesheet">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
	</head>

	<body>
		<header>
			<h1>Kazimazi's Dark and Darker simulator</h1>
		</header>

		<section>
			<div id="parameters">
				<div id="enemy">
					<h2>Enemy</h2>

					<div id="enemy-parameters">
						<label for="enemy">Choose a preset</label>
						<select id="enemy-preset" class="row-2" autocomplete="off">
							<option value="demon">Demon</option>
							<option value="ranger">Ranger</option>
						</select>

						<label>Health</label>
						<input type="text" id="health" value="" autocomplete="off">

						<label>Max Health</label>
						<input type="text" id="max-health" value="" autocomplete="off">

						<label>Magical Damage Reduction</label>
						<div class="percent-container">
							<input type="text" id="magical-damage-reduction" value="" autocomplete="off">
						</div>

						<label for="antimagic">Antimagic</label>
						<div><input type="checkbox" id="antimagic" name="antimagic"></div>

						<label for="perseverance">Perseverance</label>
						<div><input type="checkbox" id="perseverance" name="perseverance"></div>

						<label for="debuff-duration-reduction">Debuff Duration Reduction</label>
						<div class="percent-container">
							<input type="text" id="debuff-duration-reduction" value="" autocomplete="off">
						</div>

						<label for="one-man-band" class="legacy">One-Man Band Healing</label>
						<div class="mat-icon-container">
							<input type="checkbox" id="one-man-band" name="one-man-band">
							<span title="Removed in patch #132" class="material-symbols-outlined mat-icon">
								info
							</span>
						</div>

						<label for="one-man-band-magical-healing">Magical Healing</label>
						<input type="text" id="one-man-band-magical-healing" name="one-man-band-magical-healing" value="" autocomplete="off">

						<label for="demon-form">Demon Form</label>
						<div><input type="checkbox" id="demon-form" name="demon-form"></div>

						<label for="curse-of-weakness">Curse of Weakness</label>
						<div><input type="checkbox" id="curse-of-weakness" name="curse-of-weakness"></div>
					</div>
				</div>

				<hr>

				<div id="attadcker">
					<h2>Attacker</h2>

					<div id="attacker-parameters">
						<label>Magical Base Damage</label>
						<input type="text" id="magical-base-damage" class="row-2" value="" autocomplete="off">

						<label>Magic Power Bonus</label>
						<div class="percent-container">
							<input type="text" id="magic-power-bonus" value="" autocomplete="off">
						</div>

						<label>Magic Penetration</label>
						<div class="percent-container">
							<input type="text" id="magic-penetration" value="" autocomplete="off">
						</div>

						<label>Additional Magic Damage</label>
						<input type="text" id="additional-magic-damage" value="" autocomplete="off">

						<label>True Magic Damage</label>
						<input type="text" id="true-magic-damage" value="" autocomplete="off">

						<label for="infernal-usery">Infernal Usery</label>
						<div><input type="checkbox" id="infernal-usery" name="infernal-usery"></div>
					</div>
				</div>
			</div>

			<br>

			<div id="spells">
				<img id="curse-of-pain-button" src="./assets/96px-Spell_Curse_of_Pain.png" alt="Curse of Pain button" title="Curse of Pain">
				<img id="curse-of-sacrifice-button" src="./assets/96px-Spell_Power_of_Sacrifice.png" alt="Curse of Sacrifice button" title="Curse of Sacrifice">
				<img id="bolt-of-darkness-button" src="./assets/96px-Spell_Bolt_of_Darkness.png" alt="Bolt of Darkness button" title="Bolt of Darkness">
			</div>

			<br>

			<div id="status">
				<div id="health-bar-border">
					<div id="health-bar"></div>
					<div id="health-bar-text">
						<span id="current-health"></span>
						/ <span id="bar-max-health"></span>
					</div>
				</div>
			</div>

			<br>

			<div id="control-buttons">
				<div class="mat-icon-container">
					<span id="play" class="material-symbols-outlined mat-icon">
					</span>
					<span id="reset" class="material-symbols-outlined mat-icon">
						restart_alt
					</span>
				</div>
			</div>

			<script type="module" src="./app.js"></script>
		</section>

		<footer>
			Made for Early Access Hotfix #132
		</footer>
	</body>
</html>
